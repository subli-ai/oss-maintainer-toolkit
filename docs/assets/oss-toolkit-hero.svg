<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 465" role="img" aria-labelledby="title desc"><title id="title">OSS Maintainer Toolkit overview</title><desc id="desc">A visual introducing a repository checklist and a sample checklist report.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B152B"/><stop offset=".65" stop-color="#11274A"/><stop offset="1" stop-color="#0C1427"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="1280" height="465" rx="25" fill="url(#bg)"/><circle cx="1130" cy="55" r="240" fill="#315B9D" opacity=".13"/><circle cx="520" cy="520" r="290" fill="#7749DD" opacity=".09"/><g font-family="Arial,Helvetica,sans-serif"><text x="56" y="60" fill="#98C5FF" font-size="20" font-weight="700" letter-spacing="3">OSS MAINTAINER TOOLKIT</text><text x="56" y="145" fill="#FFFFFF" font-size="62" font-weight="750" >Ready to share</text><text x="56" y="216" fill="#FFFFFF" font-size="62" font-weight="750" >your code?</text><rect x="57" y="247" width="338" height="7" rx="4" fill="url(#accent)"/><text x="56" y="299" fill="#CFD9E9" font-size="23" font-weight="500" >Check the basics before people visit,</text><text x="56" y="334" fill="#CFD9E9" font-size="23" font-weight="500" >download, or contribute to your repo.</text><rect x="56" y="369" width="292" height="48" rx="13" fill="#254772" stroke="#618BD2"/><text x="76" y="400" fill="#F0F7FF" font-size="16" font-weight="700" >README  •  LICENSE  •  TESTS</text><rect x="667" y="60" width="566" height="352" rx="22" fill="#0C1627" stroke="#466081" stroke-width="2"/><rect x="667" y="60" width="566" height="57" rx="22" fill="#1E2D45"/><rect x="667" y="91" width="566" height="26" fill="#1E2D45"/><circle cx="694" cy="88" r="6" fill="#F87171"/><circle cx="716" cy="88" r="6" fill="#FBBF24"/><circle cx="738" cy="88" r="6" fill="#34D399"/><text x="762" y="94" fill="#CBD9EC" font-size="16" font-weight="700" >SAMPLE REPOSITORY SCAN</text><text x="702" y="158" fill="#F9FAFB" font-size="27" font-weight="700" >Six essentials found</text><text x="702" y="193" fill="#FFCB83" font-size="20" font-weight="600" >Two items need attention</text><line x1="703" y1="216" x2="1199" y2="216" stroke="#31445E"/><text x="704" y="250" fill="#96E5BE" font-size="19" font-weight="600" >✓ README.md</text><text x="963" y="250" fill="#96E5BE" font-size="19" font-weight="600" >✓ LICENSE</text><text x="704" y="286" fill="#96E5BE" font-size="19" font-weight="600" >✓ CONTRIBUTING</text><text x="963" y="286" fill="#96E5BE" font-size="19" font-weight="600" >✓ CI workflow</text><text x="704" y="322" fill="#96E5BE" font-size="19" font-weight="600" >✓ CHANGELOG</text><text x="963" y="322" fill="#96E5BE" font-size="19" font-weight="600" >✓ Tests</text><text x="704" y="358" fill="#F9C983" font-size="19" font-weight="600" >! SECURITY policy</text><text x="963" y="358" fill="#F9C983" font-size="19" font-weight="600" >! Code of conduct</text><text x="682" y="441" fill="#A7BAD5" font-size="14" font-weight="500" >Illustrative example · actual CLI output is JSON</text></g></svg>