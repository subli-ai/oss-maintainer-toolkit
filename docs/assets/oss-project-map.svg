<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Open-source developer tools overview</title><desc id="desc">Three groups of five candidate projects each: AI agent safety, AI infrastructure, and developer utilities.</desc><rect width="1200" height="610" rx="24" fill="#0b1220"/><text x="52" y="64" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">15 open-source developer tools</text><text x="52" y="94" fill="#9fb0cc" font-family="Arial,sans-serif" font-size="16">Three project collections · tested MVPs · individual adoption not yet verified</text><rect x="40" y="130" width="370" height="432" rx="20" fill="#141f32" stroke="#324158"/><rect x="60" y="150" width="8" height="36" rx="4" fill="#3b82f6"/><text x="83" y="178" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">AI Agent Safety</text><circle cx="69" cy="215" r="5" fill="#3b82f6"/><text x="84" y="220" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">ScopeFence</text><text x="84" y="243" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Flags out-of-scope Git changes</text><circle cx="69" cy="281" r="5" fill="#3b82f6"/><text x="84" y="286" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">LoopBrake</text><text x="84" y="309" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Finds repeat action/error patterns</text><circle cx="69" cy="347" r="5" fill="#3b82f6"/><text x="84" y="352" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">APITruth</text><text x="84" y="375" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Checks supported Python API references</text><circle cx="69" cy="413" r="5" fill="#3b82f6"/><text x="84" y="418" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">DoneProof</text><text x="84" y="441" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Records configured acceptance checks</text><circle cx="69" cy="479" r="5" fill="#3b82f6"/><text x="84" y="484" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">MockLeak</text><text x="84" y="507" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Flags likely stubs and mock wiring</text><rect x="430" y="130" width="370" height="432" rx="20" fill="#141f32" stroke="#324158"/><rect x="450" y="150" width="8" height="36" rx="4" fill="#a78bfa"/><text x="473" y="178" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">AI Infrastructure</text><circle cx="459" cy="215" r="5" fill="#a78bfa"/><text x="474" y="220" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Agent State Receipts</text><text x="474" y="243" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Tracks task-state evidence</text><circle cx="459" cy="281" r="5" fill="#a78bfa"/><text x="474" y="286" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">MCP Retry Lab</text><text x="474" y="309" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Tests lost-response retry behavior</text><circle cx="459" cy="347" r="5" fill="#a78bfa"/><text x="474" y="352" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">MCP Transport Lab</text><text x="474" y="375" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Checks captured transport observations</text><circle cx="459" cy="413" r="5" fill="#a78bfa"/><text x="474" y="418" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Spec Oracle</text><text x="474" y="441" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Stores independent behavior contracts</text><circle cx="459" cy="479" r="5" fill="#a78bfa"/><text x="474" y="484" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Vibe DB Guard</text><text x="474" y="507" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Checks migration-file risks</text><rect x="820" y="130" width="370" height="432" rx="20" fill="#141f32" stroke="#324158"/><rect x="840" y="150" width="8" height="36" rx="4" fill="#34d399"/><text x="863" y="178" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Developer Utilities</text><circle cx="849" cy="215" r="5" fill="#34d399"/><text x="864" y="220" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">A11y Scout</text><text x="864" y="243" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Accessibility checks</text><circle cx="849" cy="281" r="5" fill="#34d399"/><text x="864" y="286" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Dependency Impact</text><text x="864" y="309" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Dependency change insights</text><circle cx="849" cy="347" r="5" fill="#34d399"/><text x="864" y="352" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Plain Language Check</text><text x="864" y="375" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Readable documentation checks</text><circle cx="849" cy="413" r="5" fill="#34d399"/><text x="864" y="418" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Repo Story</text><text x="864" y="441" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Repository explanation</text><circle cx="849" cy="479" r="5" fill="#34d399"/><text x="864" y="484" fill="#eef4ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Traceback Guide</text><text x="864" y="507" fill="#a8bad0" font-family="Arial,sans-serif" font-size="13">Error explanation aid</text><text x="50" y="590" fill="#8ea1ba" font-family="Arial,sans-serif" font-size="13">Illustrative portfolio graphic • Unit-tested source bundles, not certified production releases</text></svg>