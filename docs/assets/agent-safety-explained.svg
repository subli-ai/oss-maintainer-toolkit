<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 635" role="img" aria-labelledby="title desc"><title id="title">Five practical AI coding quality checks</title><desc id="desc">Examples of when developers might use ScopeFence, LoopBrake, APITruth, DoneProof and MockLeak. Current capabilities are advisory.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B152B"/><stop offset=".65" stop-color="#11274A"/><stop offset="1" stop-color="#0C1427"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="1280" height="635" rx="23" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="58" fill="#F7FAFF" font-size="35" font-weight="750" >5 AI-CODE SAFETY CHECKS</text><text x="43" y="94" fill="#ADBFDB" font-size="20" font-weight="500" >Problems you recognize  →  tools that help you notice them</text><rect x="42" y="127" width="1196" height="80" rx="16" fill="#182A45" stroke="#355374"/><rect x="42" y="127" width="8" height="80" rx="4" fill="#5DA7FF"/><text x="73" y="159" fill="#FFFFFF" font-size="23" font-weight="750" >ScopeFence</text><text x="73" y="186" fill="#F2BEA9" font-size="17" font-weight="500" >AI changed unrelated files</text><text x="692" y="171" fill="#BBEFD6" font-size="19" font-weight="600" >→ Flags paths outside the approved scope</text><rect x="42" y="221" width="1196" height="80" rx="16" fill="#182A45" stroke="#355374"/><rect x="42" y="221" width="8" height="80" rx="4" fill="#AF91FF"/><text x="73" y="253" fill="#FFFFFF" font-size="23" font-weight="750" >LoopBrake</text><text x="73" y="280" fill="#F2BEA9" font-size="17" font-weight="500" >AI keeps repeating failed actions</text><text x="692" y="265" fill="#BBEFD6" font-size="19" font-weight="600" >→ Finds repeated calls in session logs</text><rect x="42" y="315" width="1196" height="80" rx="16" fill="#182A45" stroke="#355374"/><rect x="42" y="315" width="8" height="80" rx="4" fill="#72D4D5"/><text x="73" y="347" fill="#FFFFFF" font-size="23" font-weight="750" >APITruth</text><text x="73" y="374" fill="#F2BEA9" font-size="17" font-weight="500" >AI invented a Python function</text><text x="692" y="359" fill="#BBEFD6" font-size="19" font-weight="600" >→ Checks supported installed-package APIs</text><rect x="42" y="409" width="1196" height="80" rx="16" fill="#182A45" stroke="#355374"/><rect x="42" y="409" width="8" height="80" rx="4" fill="#FFC06A"/><text x="73" y="441" fill="#FFFFFF" font-size="23" font-weight="750" >DoneProof</text><text x="73" y="468" fill="#F2BEA9" font-size="17" font-weight="500" >AI says 'done' without evidence</text><text x="692" y="453" fill="#BBEFD6" font-size="19" font-weight="600" >→ Runs checks you explicitly define</text><rect x="42" y="503" width="1196" height="80" rx="16" fill="#182A45" stroke="#355374"/><rect x="42" y="503" width="8" height="80" rx="4" fill="#93DEA6"/><text x="73" y="535" fill="#FFFFFF" font-size="23" font-weight="750" >MockLeak</text><text x="73" y="562" fill="#F2BEA9" font-size="17" font-weight="500" >App still contains demo-only code</text><text x="692" y="547" fill="#BBEFD6" font-size="19" font-weight="600" >→ Flags likely placeholders and stubs</text><text x="47" y="619" fill="#99B1D2" font-size="15" font-weight="500" >Advisory MVPs · Detection is not automatic prevention or a production audit</text> </g></svg>