[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-maintainer-toolkit"
version = "0.2.1"
description = "A dependency-free CLI for checking basic open-source repository hygiene."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "subli-ai" }]
keywords = ["open-source", "maintainer", "github", "repository", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
oss-maintainer-toolkit = "oss_maintainer_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
